# Alacritty configuration

[window]
opacity = 0.95
padding = { x = 10, y = 10 }

[font]
size = 12.0

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[colors.primary]
background = "#0d0d0d"
foreground = "#e0e0e0"

[colors.normal]
black = "#1e1e1e"
red = "#ff5555"
green = "#00ff00"
yellow = "#ffff55"
blue = "#5555ff"
magenta = "#ff55ff"
cyan = "#00ffff"
white = "#e0e0e0"

[colors.bright]
black = "#555555"
red = "#ff5555"
green = "#00ff00"
yellow = "#ffff55"
blue = "#5555ff"
magenta = "#ff55ff"
cyan = "#00ffff"
white = "#ffffff"
